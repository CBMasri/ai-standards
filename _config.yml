title: AI Standards
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "standards.md"
    values:
      permalink: /

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
